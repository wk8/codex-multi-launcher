appId: local.wk.codex-personal-launcher
productName: Codex Personal Launcher
directories:
  output: dist-app
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
mac:
  icon: assets/app.icns
  artifactName: codex-personal-launcher-${version}-${arch}-mac.${ext}
  target:
    - dir
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  notarize: false
protocols:
  - name: Codex browser links
    schemes:
      - codex
asar: true
